<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Direktori Personel Bawaslu Sulsel</title>
    <style>
        :root {
            --brand: #F58220;
            --brand-dark: #D96A00;
            --bg: #F6F8FC;
            --surface: #FFFFFF;
            --line: #E5E7EB;
            --ink: #1E293B;
            --muted: #64748B;
            --danger: #C62828;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Inter, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-card {
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, .08);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--ink);
        }
        
        .subtitle {
            font-size: 14px;
            color: var(--muted);
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 2px solid var(--line);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(245, 130, 32, .1);
        }
        
        .btn-login {
            width: 100%;
            height: 52px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover:not(:disabled) {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 130, 32, .25);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-error {
            background: #fee;
            color: var(--danger);
            border: 1px solid #fcc;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo">
                <img src="assets/image/bawaslu.png" alt="Logo Bawaslu">
            </div>
            <h1>Direktori Personel</h1>
            <p class="subtitle">Bawaslu Provinsi Sulawesi Selatan</p>
        </div>
        
        <div class="alert alert-error" id="alert" role="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="token">Token Akses</label>
                <input 
                    type="password" 
                    id="token" 
                    name="token" 
                    placeholder="Masukkan token akses"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            
            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText">Masuk</span>
            </button>
        </form>
        
        <div class="footer">
            <p>Hubungi administrator untuk mendapatkan token akses</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('loginForm');
        const tokenInput = document.getElementById('token');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const alert = document.getElementById('alert');
        
        function showError(message) {
            alert.textContent = message;
            alert.classList.add('show');
        }
        
        function hideError() {
            alert.classList.remove('show');
        }
        
        function setLoading(loading) {
            btnLogin.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="spinner"></span> Memverifikasi...';
            } else {
                btnText.textContent = 'Masuk';
            }
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const token = tokenInput.value.trim();
            if (!token) {
                showError('Token tidak boleh kosong');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Login sukses, redirect ke halaman utama
                    window.location.href = '/';
                } else {
                    // Login gagal
                    showError(data.error || 'Token tidak valid');
                    setLoading(false);
                }
            } catch (error) {
                showError('Terjadi kesalahan koneksi. Coba lagi.');
                setLoading(false);
            }
        });
        
        // Auto-focus input saat halaman dimuat
        tokenInput.focus();
    </script>
</body>
</html>
